name: Ctrl Tests

on:
  push:
  pull_request:

jobs:
  safe-tests:
    runs-on: ubuntu-latest
    env:
      DISABLE_BACKGROUND_TASKS: "1"
      DATABASE_URL: "sqlite:///:memory:"
      LONG_TERM_CONTAINER_LIMIT: "1"
      CONTAINER_CLEANUP_AFTER_DAYS: "7"
      CONTAINER_CLEANUP_REMINDER_HOURS: "72,24,12"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run safe pytest suite with coverage
        run: |
          mkdir -p reports
          python -m pytest -m "not integration and not legacy" \
            --cov --cov-report=term-missing --cov-report=xml --cov-report=html \
            --junitxml=reports/pytest.xml

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/pytest.xml

      - name: Upload coverage html
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: reports/htmlcov
